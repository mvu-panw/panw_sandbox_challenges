<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PANW Capture the Flags — Registration</title>
  <link rel="icon" type="image/png" href="assets/images/PAN-Color.png" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <nav>
    <img src="assets/images/PAN-Color.png" alt="Palo Alto Networks" class="logo" />
    <a class="site-title" href="menu.html">PANW Capture the Flags</a>
  <div class="nav-links">
      <a href="storylane-value-prop.html">Storylane Value Proposition</a>
  </div>
  </nav>

  <main style="display:flex;align-items:center;justify-content:center;">
    <div style="width:100%;max-width:460px;">
      <div class="page-header">
        <h1>Welcome</h1>
        <p>Enter your details to access the demos and capture the flag challenges.</p>
      </div>

      <div class="card">
        <form id="registration-form" novalidate>
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Jane Smith" required autocomplete="name" />
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="jane@example.com" required autocomplete="email" />
            <p class="form-note">Use the email address you provided during sign-up.</p>
          </div>
          <p id="form-error" style="color:#ff6b6b;font-size:0.85rem;margin-bottom:16px;min-height:1.2em;"></p>
          <button type="submit" id="submit-btn" class="btn btn-primary">Continue</button>
        </form>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2025 Palo Alto Networks. All rights reserved.
  </footer>

  <script src="assets/js/registration.js"></script>
</body>
</html>
