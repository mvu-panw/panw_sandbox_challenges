<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PANW Sandbox Challenges — Sandbox Challenge Companion Guide</title>
  <link rel="icon" type="image/png" href="assets/images/PAN-Color.png" />
  <link rel="stylesheet" href="assets/css/styles.css?v=2" />
  <style>
    .doc-frame {
      width: 100%;
      height: 80vh;
      min-height: 600px;
      border: none;
      border-radius: var(--radius);
    }
  </style>
</head>
<body>
  <nav>
    <img src="assets/images/panw_RGB_Logo_Negative.png" alt="Palo Alto Networks" class="logo" />
    <a class="site-title" href="index.html">Sandbox Challenges</a>
    <div class="nav-links">
      <a href="demo.html">&#8592; Demo</a>
      <a href="quiz.html">Take the Quiz</a>
    </div>
  </nav>

  <main>
    <div class="page-header">
      <h1>Sandbox Challenge Companion Guide</h1>
      <p>Use this reference guide alongside the Sandbox Challenge challenges.</p>
    </div>

    <!--
      Replace the src below with your Google Doc embed URL.
      In Google Docs: File → Share → Publish to web → Embed → copy the src URL.
      It should look like: https://docs.google.com/document/d/DOCUMENT_ID/pub?embedded=true
    -->
    <div class="embed-wrap">
      <iframe
        id="companion-doc"
        class="doc-frame"
        src="https://docs.google.com/document/d/13OY9ID9Gen2WFVMFCeHbU7dQ2WNMcHGsCbkssg9UqDQ/preview"
        title="Sandbox Challenge Companion Guide">
      </iframe>
    </div>

    <div class="cta-row">
      <a href="quiz.html" class="btn btn-primary">✏️ Take the Quiz</a>
      <a href="demo.html" class="btn btn-secondary">&#8592; Back to Demo</a>
    </div>
  </main>

  <footer>
    &copy; 2025 Palo Alto Networks. All rights reserved.
  </footer>

  <script>

    // Show placeholder message if URL not yet configured
    const frame = document.getElementById('companion-doc');
    if (frame.src.includes('YOUR_GOOGLE_DOC')) {
      frame.style.display = 'none';
      const msg = document.createElement('div');
      msg.className = 'status-center';
      msg.innerHTML = '<p>Companion guide not yet configured. Paste the Google Doc embed URL into <code>companion.html</code>.</p>';
      frame.parentNode.insertBefore(msg, frame);
    }
  </script>
</body>
</html>
