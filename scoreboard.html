<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PANW Capture the Flags — Scoreboard</title>
  <link rel="icon" type="image/png" href="assets/images/PAN-Color.png" />
  <link rel="stylesheet" href="assets/css/styles.css?v=2" />
</head>
<body>
  <nav>
    <img src="assets/images/PAN-Color.png" alt="Palo Alto Networks" class="logo" />
    <a class="site-title" href="menu.html">PANW Capture the Flags</a>
    <div class="nav-links">
      <a href="menu.html">&#8592; Menu</a>
      <a href="storylane-value-prop.html">Storylane Value Proposition</a>
    </div>
  </nav>

  <main>
    <div class="page-header">
      <h1>Scoreboard</h1>
      <p>Rankings are based on quiz score. Ties are broken by earliest submission time.</p>
    </div>

    <div class="card">
      <div id="scoreboard-status" class="status-center">
        <p>Loading scores…</p>
      </div>
      <table class="scoreboard-table" id="scoreboard-table" style="display:none;">
        <thead>
          <tr>
            <th style="width:60px">Rank</th>
            <th>Name</th>
            <th>Email</th>
            <th>Score</th>
            <th>Submitted</th>
          </tr>
        </thead>
        <tbody id="scoreboard-body"></tbody>
      </table>
      <p class="refresh-note" id="last-updated"></p>
    </div>
  </main>

  <footer>
    &copy; 2025 Palo Alto Networks. All rights reserved.
  </footer>

  <script>
    if (!sessionStorage.getItem('registeredName')) window.location.href = 'index.html';

    // Show table once data loads
    const origLoad = window.loadScoreboard;
  </script>
  <script src="assets/js/scoreboard.js"></script>
  <script>
    // Unhide table when rows are populated
    const observer = new MutationObserver(() => {
      const tbody = document.getElementById('scoreboard-body');
      const table = document.getElementById('scoreboard-table');
      if (tbody && tbody.children.length > 0) {
        table.style.display = 'table';
      }
    });
    observer.observe(document.getElementById('scoreboard-body'), { childList: true });
  </script>
</body>
</html>
